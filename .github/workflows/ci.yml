name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # v6 부터 pnpm 11 지원 — 버전은 package.json 의 packageManager 를 읽는다.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      # 빌드가 generateStaticParams 에서 카탈로그·Gaia 대응 ID 검증을 함께 돌린다.
      - run: pnpm build
      # 셰이더 컴파일·장면 런타임 오류는 lint·build 가 못 잡으므로 @smoke 테스트만 빌드 결과로 실제 브라우저에서 연다(전체 e2e 는 로컬).
      # 기본 headless 실행은 headless shell 만 쓰므로 전체 Chromium 은 받지 않는다.
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm exec playwright test --grep @smoke
