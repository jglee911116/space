name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # v6 부터 pnpm 11 지원 — 버전은 package.json 의 packageManager 를 읽는다.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      # 빌드가 generateStaticParams 에서 카탈로그·Gaia 대응 ID 검증을 함께 돌린다.
      - run: pnpm build
